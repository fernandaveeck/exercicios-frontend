<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="gallery">

        <figure class="gallery-item-1">
            <img src="images/cachorro-caneca.jpg" alt="filhote na caneca" class="gallery-img">
        </figure>

        <figure class="gallery-item-2">
            <img src="images/pawpawdog.webp" alt="cachorrinho mostrando a patinha" class="gallery-img">
        </figure>

        <figure class="gallery-item-3">
            <img src="images/senior.jpg" alt="cachorrinho senior dormindo" class="gallery-img">
        </figure>

        <figure class="gallery-item-4">
            <img src="images/cachorrinhos-irmaozinhos.avif" alt="cachorrinhos irmãos juntos" class="gallery-img">
        </figure>

        <figure class="gallery-item-5">
            <img src="images/wheelchairdog.jpg" alt="cachorrinho na cadeira de rodas" class="gallery-img">
        </figure>

        <figure class="gallery-item-6">
            <img src="images/Senior-Dachshund.avif" alt="cachorrinho salsicha senior" class="gallery-img">
        </figure>

    </div>

</body>

</html>
