<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Olivia Rodrigo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-image: url("images/olivia-bg2.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: cursive;
            text-align: center;
            padding-top: 100px;
            padding-bottom: 100px;
        }

        nav {
            width: 100%;
            height: 80px;

            background-color: rgb(255, 252, 250);

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 30px;

            position: fixed;
            top: 0;
            left: 0;
        }

        nav a {
            color: black;
            text-decoration: none;
            font-size: 30px;
        }

        nav a:hover {
            color: rgb(150, 80, 180);
        }

        nav .logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
        }

        nav .logo:hover {
            color: initial;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        h1 {
            font-size: 70px;
        }

        .botao-youtube {
            display: inline-block;
            background-color: rgb(255, 252, 250);
            color: black;

            padding: 15px 25px;
            border-radius: 10px;

            text-decoration: none;
            font-size: 20px;
        }

        .botao-youtube:hover {
            background-color: rgb(212, 174, 247);
        }

        footer {
            width: 100%;
            height: 80px;
            background-color: rgb(255, 252, 250);

            display: flex;
            justify-content: center;
            align-items: center;

            position: fixed;
            bottom: 0;
            left: 0;
        }

        iframe {
            max-width: 90%;
        }
        
    </style>
</head>

<body>

    <header>
        <nav>
            <a class="logo" href="index.html">
                <img src="images/Olivia_Rodrigo_OR_Logo.svg.webp" alt="Logo Olivia Rodrigo">
            </a>
            <a href="index.html">Home</a>
            <a href="sobre.html">Sobre</a>
            <a href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <h1>Olivia Rodrigo</h1>

        <iframe width="560" height="315" src="https://www.youtube.com/embed/_Bjf-iExroI"
            title="Vídeo da Olivia Rodrigo no YouTube" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
        </iframe>

        <a class="botao-youtube" href="https://youtube.com/@oliviarodrigo" target="_blank" rel="noopener noreferrer">
            Conheça mais!
        </a>
    </main>

    <footer>
        <p>Criado por Fernanda © 2026</p>
    </footer>

</body>

</html>
