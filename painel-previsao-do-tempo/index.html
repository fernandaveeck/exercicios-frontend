<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Previsão do Tempo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="painel">

        <div class="cabecalho">

            <img src="images/sol.svg" alt="Sol">

            <h1>PREVISÃO DO TEMPO</h1>

            <p>
                Hoje<br>
                Porto Alegre - RS
            </p>

        </div>

        <div class="temperatura tamanho">

            <img src="images/sol.svg" alt="Sol">

            <small>Temperatura</small>

            <strong>26°C</strong>

        </div>

        <div class="umidade tamanho">

            <img src="images/gota.svg" alt="Umidade">

            <small>Umidade</small>

            <strong>65%</strong>

        </div>

        <div class="vento tamanho">

            <img src="images/vento.svg" alt="Vento">

            <small>Vento</small>

            <strong>12 km/h</strong>

        </div>

        <div class="condicao tamanho">

            <img src="images/nuvem.svg" alt="Condição">

            <small>Condição</small>

            <strong>Ensolarado</strong>

        </div>

        <div class="amanha tamanho">

            <img src="images/calendario.svg" alt="Calendário">

            <small>Amanhã</small>

            <strong>25°C</strong>

        </div>

        <div class="localizacao tamanho">

            <img src="images/localizacao.svg" alt="Localização">

            <small>Localização</small>

            <strong>Porto Alegre</strong>

        </div>

    </div>

</body>

</html>
